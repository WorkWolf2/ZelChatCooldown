# Config file for Cooldowns

debug: false

# Puoi impostare i permessi che vuoi per usare per i cooldowns; Il tempo è in secondi
cooldowns:
  permission.perm1: 30
  permission.perm2: 15
  permission.vip: 5

messages:
  cooldown: "<red>⏳ Devi aspettare ancora <yellow>%zelchatcooldown_remaining% <red>secondi!"

settings:
  actionbar: true
  # Cooldown (in secondi) applicato a chi NON ha nessuno dei permessi sopra.
  # Rimuovi/commenta questa riga se vuoi che chi non ha permessi resti esente (comportamento attuale).
  default-cooldown: 20
  bypass-permission: "zelchatcooldown.bypass"

  enable-sound: true
  sound: ENTITY_PLAYER_LEVELUP